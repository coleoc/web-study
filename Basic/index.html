<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>나의 첫 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>안녕하세요!</h1>
        <nav>
            <a href="#likes">취미</a>
            <a href="#top-Games">좋아하는 게임 3가지</a>
        </nav>
    </header>

    <main>
        <section class="card" id="likes">
            <h2>취미</h2>
            <div class="hobby-list">
                <div class="hobby">
                    <img src="images/Game.png" alt="게임">
                    <p>게임</p>
                </div>
                <div class="hobby">
                    <img src="images/Movie.png" alt="영화">
                    <p>영화</p>
                </div>
                <div class="hobby">
                    <img src="images/Music.png" alt="음악">
                    <p>음악</p>
                </div>
            </div>
        </section>

        <section class="card" id="top-Games">
            <h2>Top3</h2>
            <ol>
                <li><a href="https://namu.wiki/w/Dead%20Cells" target="_blank">Dead Cells</a></li>
                <li><a href="https://namu.wiki/w/Hollow%20Knight" target="_blank">Hollow Knight</a></li>
                <li><a href="https://namu.wiki/w/Death's%20Gambit" target="_blank">Death's Gambit</a></li>
            </ol>
        </section>

        <section class="card gallery" id="gallery">
            <h2>좋아하는 이미지</h2>
            <img src="images/wallpaperbetter.png" alt="판타지풍 늑대 이미지">
        </section>
    </main>

    <footer>
        <p>© 1997.04.03 이중탁</p>
    </footer>

</body>

</html>

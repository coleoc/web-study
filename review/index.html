<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메트로배니아 추천 사이트</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>

<body>
    <header>
        <h1>메트로배니아 추천 사이트</h1>
        <nav>
            <a href="#games">게임들</a>
            <a href="#introduce">소개</a>
        </nav>

    </header>

    <main>
        <section class="card" id="introduce">
            <h2>소개</h2>
            <p>
                이 사이트는 메트로배니아 장르의 게임들을 추천하는 사이트입니다.
                메트로배니아 게임은 탐험과 액션을 결합한 장르로,
                플레이어가 점점 더 많은 능력을 얻으며 새로운 지역을 탐험할 수 있게됩니다.
            </p>
        </section>

        <section class="card" id="games">
            <h2>게임들</h2>
            <div class="search">
                <button class="sort-btn" data-sort="recommended">추천순</button>
                <button class="sort-btn" data-sort="nameAsc">이름순</button>
                <button class="sort-btn" data-sort="yearDesc">최신순</button>
                <input type="text" id="search" placeholder="게임 이름 검색">
             </div>
            <div class="game-list"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 이중탁</p>
    </footer>
</body>

</html>
